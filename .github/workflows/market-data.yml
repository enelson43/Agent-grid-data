name: market-data

on:
  schedule:
    # Times are UTC. GitHub delays or skips some scheduled runs, so the build also
    # refreshes any section that has gone stale, whatever the mode.
    - cron: "7,37 13-21 * * 1-5"    # light: prices every 30 minutes in the session
    - cron: "47 14,16,18,20 * * 1-5" # options
    - cron: "40 22 * * 1-5"          # full: screener, fundamentals, options after the close
    - cron: "15 2 * * 2-6"           # backup: catches up any section a skipped run missed
    - cron: "0 21 * * 0"             # Sunday full run before the Long-Term Position Builder
  workflow_dispatch:
    inputs:
      mode:
        description: "light, options or full"
        default: "full"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            # Pick the mode from the schedule that fired, not the clock, so late runs keep their job.
            case "${{ github.event.schedule }}" in
              "47 14,16,18,20 * * 1-5") MODE=options ;;
              "40 22 * * 1-5"|"0 21 * * 0") MODE=full ;;
              *) MODE=light ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Restore the previous data pack
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Build
        run: python scripts/build_data.py out "${{ steps.mode.outputs.mode }}"

      - name: Publish to the data branch
        run: |
          cp DATA_README.md out/README.md
          cp watchlist.txt out/watchlist.txt
          cp sector_etfs.csv out/sector_etfs.csv
          cd out
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="agent-grid-data" -c user.email="actions@users.noreply.github.com" \
            commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ) ${{ steps.mode.outputs.mode }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
